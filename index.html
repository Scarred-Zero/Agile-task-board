<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Agile task board - layout poitioning</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="app-header">
            <div class="header-brand">
                <h1>Agile Task Board</h1>
            </div>
            <button class="btn-primary" id="open-modal-btn" onclick="document.getElementById('task-modal').style.display = 'flex'">+ New Task</button>
        </header>

        <!-- Main Board Container -->
        <main class="kanban-board">
            <!-- To Do Column -->
            <section class="kanban-column">
                <header class="column-header">
                    <h2>To Do</h2>
                </header>

                <!-- Task Card with Absolute Action Button -->
                <article class="task-card" onclick=" document.getElementById('task-sidebar').classList.toggle('open')">
                    <span class="priority-badge">HIGH</span>
                    <button class="card-action-btn" aria-label="Task options">
                        &vellip;
                    </button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item">Edit</button>
                        <button class="dropdown-item">Move Column</button>
                        <button class="dropdown-item">Delete</button>
                    </div>
                    <span class="task-tag">Backend</span>
                    <h3>Setup Database Schema</h3>
                    <p>
                        Design PostgreSQL tables for Users, Boards, and Tasks.
                    </p>
                </article>

                <article class="task-card">
                    <button class="card-action-btn" aria-label="Task options">
                        &vellip;
                    </button>
                    <span class="task-tag">Architecture</span>
                    <h3>Configure FastAPI Routing</h3>
                    <p>Set up base REST endpoints for task CRUD operations.</p>
                </article>
            </section>
        </main>

        <aside id="task-sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>Task Details</h2>
                <button id="close-sidebar">&times;</button>
            </div>
            <div class="sidebar-body">
                <p>Details about the selected task go here.</p>
            </div>
        </aside>

        <!-- Fixed Visual Overlay Modal Backdrop -->
        <div class="modal-backdrop" id="task-modal">
            <div
                class="modal-dialog"
                role="dialog"
                aria-labelledby="modal-title"
                aria-modal="true"
            >
                <button class="modal-close-btn" aria-label="Close modal" onclick="document.getElementById('task-modal').style.display = 'none '">
                    &times;
                </button>
                <h2 id="modal-title">Create New Task</h2>
                <form class="modal-form">
                    <label for="task-title">Task Title</label>
                    <input
                        type="text"
                        id="task-title"
                        name="title"
                        placeholder="e.g., Implement JWT Auth"
                        required
                    />

                    <label for="task-desc">Description</label>
                    <textarea
                        id="task-desc"
                        name="description"
                        rows="4"
                        placeholder="Task details..."
                    ></textarea>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            Save Task
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
